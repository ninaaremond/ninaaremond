
name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF"
            git reset --mixed FETCH_HEAD
            git add koi/koi.gif
            if git diff --cached --quiet; then
              echo "The koi is unchanged; nothing to commit."
              exit 0
            fi
            git commit --quiet --message "koi: draw the day's koi"
            if git push --quiet origin "HEAD:$GITHUB_REF"; then
              exit 0
            fi
            echo "Push failed; refreshing the branch (attempt $attempt of 3)."
          done
          exit 1
